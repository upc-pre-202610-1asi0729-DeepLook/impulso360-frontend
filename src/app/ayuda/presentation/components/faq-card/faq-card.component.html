<section class="help-card">
    <div class="section-header">
        <h2>{{ 'HELP.FAQ_TITLE' | translate }}</h2>
        <p>{{ 'HELP.FAQ_DESCRIPTION' | translate }}</p>
    </div>

    <mat-accordion class="faq-accordion">
        <mat-expansion-panel *ngFor="let faq of faqs">
            <mat-expansion-panel-header>
                <mat-panel-title>
                    {{ faq.question }}
                </mat-panel-title>
            </mat-expansion-panel-header>

            <p class="faq-answer">
                {{ faq.answer }}
            </p>
        </mat-expansion-panel>
    </mat-accordion>

    <div *ngIf="faqs.length === 0" class="empty-state">
        {{ 'HELP.EMPTY_FAQS' | translate }}
    </div>
</section>

<div class="service-card" [class.service-card--featured]="service.isFeatured" [class.service-card--inactive]="!service.isActive">
    <!-- Featured badge -->
    <div *ngIf="service.isFeatured" class="card-featured-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        Destacado
    </div>

    <!-- Card content -->
    <div class="card-header">
        <h3 class="card-title">{{ service.name }}</h3>
        <span class="card-status" [class.card-status--active]="service.isActive" [class.card-status--inactive]="!service.isActive">
      {{ service.status | titlecase }}
    </span>
    </div>

    <p class="card-category">{{ service.category }}</p>
    <p class="card-description">{{ service.description }}</p>

    <div class="card-footer">
        <span class="card-price">S/ {{ service.price }}</span>

        <div class="card-actions">
            <!-- Feature button (only if not featured and not at limit) -->
            <button
                    *ngIf="!service.isFeatured"
                    class="btn btn--outline"
                    [disabled]="!canFeature"
                    (click)="onToggleFeature()"
                    title="Destacar servicio">
                Destacar
            </button>

            <button class="btn-icon" (click)="onEdit()" title="Editar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
            </button>

            <button *ngIf="service.isFeatured || service.isActive" class="btn-icon btn-icon--danger" (click)="onDelete()" title="Eliminar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                </svg>
            </button>
        </div>
    </div>
</div>
